[package]
name = "droppod"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.191"
plist = "1.10.3"
pollster = "0.4"
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
